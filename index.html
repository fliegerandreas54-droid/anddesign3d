<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>A.N.D Design</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f3efe7;
  color:#2f2f2f;
}
header{
  text-align:center;
  padding:30px;
}
h1{margin:0;font-size:42px;letter-spacing:2px;}
.subtitle{color:#5a6b5d;}
nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:10px;
}
button{
  background:#6b8f71;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}
button:hover{opacity:0.9;}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}
.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.card img{
  width:100%;
  height:260px;
  object-fit:contain;
  background:#fff;
}
.card-content{padding:10px;}
.out{color:red;font-weight:bold;}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
}
.modal-box{
  background:white;
  padding:20px;
  border-radius:15px;
  width:340px;
  max-height:80vh;
  overflow:auto;
}
input{
  width:100%;
  padding:8px;
  margin:5px 0;
}
small{color:#666;}
.order-box{
  background:#f6f6f6;
  padding:8px;
  margin:5px 0;
  border-radius:10px;
  font-size:12px;
}
</style>
</head>
<body>

<header>
  <h1>A.N.D Design</h1>
  <div class="subtitle">3D Prints • Minimal • Nature Inspired 🌿</div>
</header>

<nav>
  <button onclick="openAdmin()">Admin</button>
</nav>

<div class="container" id="products"></div>

<!-- ADMIN MODAL -->
<div class="modal" id="adminModal">
  <div class="modal-box">
    <h3>Admin Login</h3>

    <div id="loginBox">
      <input id="pass" type="password" placeholder="Passwort" />
      <button onclick="login()">Login</button>
    </div>

    <div id="adminBox" style="display:none;">
      <hr>
      <h4>Produkt hinzufügen</h4>

      <input id="name" placeholder="Name" />
      <input id="price" placeholder="Preis" />
      <input id="qty" placeholder="Menge" />

      <small>Bild hochladen:</small>
      <input type="file" id="imgFile" accept="image/*" />

      <button onclick="addProduct()">Hinzufügen</button>

      <hr>
      <h4>Bestellungen</h4>
      <div id="orders"></div>
    </div>

    <button onclick="closeAdmin()" style="margin-top:10px;">Schließen</button>
  </div>
</div>

<script>
const PASS="20019442";
let isAdmin=false;

let products=JSON.parse(localStorage.getItem("products")||"[]");
let orders=JSON.parse(localStorage.getItem("orders")||"[]");

function save(){
  localStorage.setItem("products",JSON.stringify(products));
  localStorage.setItem("orders",JSON.stringify(orders));
}

function renderOrders(){
  let o=document.getElementById("orders");
  if(!o) return;
  o.innerHTML="";

  orders.forEach((ord,i)=>{
    o.innerHTML+=`
    <div class='order-box'>
      <b>${ord.name}</b><br>
      ${ord.product}<br>
      ${ord.address}<br>
      ${ord.email}<br>
      <button onclick='deleteOrder(${i})' style='background:red;margin-top:5px'>Löschen</button>
    </div>`;
  });
}

function deleteOrder(i){
  if(confirm("Bestellung löschen?")){
    orders.splice(i,1);
    save();
    renderOrders();
  }
}

function render(){
  let c=document.getElementById("products");
  c.innerHTML="";

  products.forEach((p,i)=>{
    c.innerHTML+=`
    <div class='card'>
      <img src='${p.img}' />
      <div class='card-content'>
        <h3>${p.name}</h3>
        <p>${p.price} €</p>
        <p>${p.qty>0?"Verfügbar: "+p.qty:"<span class='out'>Nicht verfügbar</span>"}</p>
        <button onclick='order(${i})' ${p.qty<=0?"disabled":""}>Bestellen</button>
        ${isAdmin?`<button style='background:red;margin-top:5px' onclick='deleteProduct(${i})'>Löschen</button>`:""}
      </div>
    </div>`;
  });
}

function deleteProduct(i){
  if(confirm("Produkt löschen?")){
    products.splice(i,1);
    save();
    render();
  }
}

function order(i){
  let name=prompt("Name");
  let address=prompt("Adresse");
  let email=prompt("Email");

  let p=products[i];
  if(p.qty<=0)return;

  p.qty--;

  let orderData={
    name,
    address,
    email,
    product:p.name
  };

  orders.unshift(orderData);

  save();
  render();
  renderOrders();

  let msg=`Neue Bestellung A.N.D Design:%0AProdukt: ${p.name}%0APreis: ${p.price}€%0AName: ${name}%0AAdresse: ${address}%0AEmail: ${email}%0A%0AAND Design meldet sich bald.`;

  window.open(`mailto:andreasflieger5@gmail.com?subject=Bestellung&body=${msg}`);

  alert("Bestellung eingegangen! AND Design meldet sich bald.");
}

function openAdmin(){document.getElementById("adminModal").style.display="flex";renderOrders();}
function closeAdmin(){document.getElementById("adminModal").style.display="none";}

function login(){
  let p=document.getElementById("pass").value;
  if(p===PASS){
    isAdmin=true;
    document.getElementById("loginBox").style.display="none";
    document.getElementById("adminBox").style.display="block";
    render();
    renderOrders();
  } else alert("Falsch");
}

function addProduct(){
  let file=document.getElementById("imgFile").files[0];
  let reader=new FileReader();

  reader.onload=function(){
    products.push({
      name:document.getElementById("name").value,
      price:document.getElementById("price").value,
      qty:parseInt(document.getElementById("qty").value),
      img:reader.result
    });

    save();
    render();
  }

  if(file) reader.readAsDataURL(file);
}

render();
</script>

</body>
</html>
